name: GalgameShell CI

# P0/P7 CI（Plan §VIII.3/§VIII.4）：
#   1) rebase-guard —— 零改铁律 + 资产合法性（无需 Android SDK）
#   2) galgame-compile —— 用 ci/stubs 对 com.winlator.galgame 全树 + 热点入口清单
#      （子树外的显式文件列表）做 javac -Xlint:all 类型门禁
# 说明：本 fork 按设计不含大二进制（wine/box64 运行时 .tzst 与 jniLibs .so），
#       故不在此做完整 APK 构建；完整构建需先按 README 补齐二进制。

on:
  push:
    branches: [galgame, main]
  pull_request:
    branches: [galgame, main]
  # release.yml 以 `uses:` 复用本工作流；没有 workflow_call 触发声明时复用调用无法调度，
  # publish / sbom 两个 needs: ci 的作业永不运行（tag 推送从未跑过：主机 release 运行数 0）。
  workflow_call: {}

jobs:
  rebase-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "零改铁律校验（Plan VIII.4）"
        # 复用调用（release.yml 的 tag 触发）没有可信的推送区间，按 ref_type 显式跳过：
        # 同一批提交在 push / pull_request 时已由同一份脚本校验过，跳过由下一步打印说明。
        if: github.ref_type != 'tag'
        env:
          GH_EVENT: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash ci/check-zero-mod.sh

      - name: "零改铁律：tag 触发时按事件跳过（说明）"
        if: github.ref_type == 'tag'
        run: |
          echo "::notice::零改铁律本次未执行——tag 推送没有可比较的推送区间。"
          echo "::notice::该校验在 push / pull_request 上对同一批提交生效，见 ci/check-zero-mod.sh。"

      - name: "校验 JSON 资产"
        run: |
          python3 -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['app/src/main/assets/engine_presets.json','app/src/main/assets/galgame_fonts.json']]; print('OK: json assets valid')"

      - name: "校验 galgame 字符串 XML"
        run: |
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('app/src/main/res/values/galgame_strings.xml'); print('OK: galgame_strings.xml valid')"

      - name: "许可证扫描（scripts/check_licenses.py：强 copyleft/SSPL 即阻断，未登记坐标告警）"
        run: |
          set -e
          python3 scripts/check_licenses.py gradle/libs.versions.toml

      # v2.9 评估整改（开源报告 P1-3）：DCO 逐提交校验。仅 PR 生效，push 直推不受影响；
      # rebase-guard 的 checkout 是 fetch-depth: 0，base.sha 可解析。签署方式见 CONTRIBUTING.md。
      - name: "DCO 签署校验（仅 pull_request）"
        if: github.event_name == 'pull_request'
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE="HEAD~20"
          # --no-merges：GitHub 为 pull_request 合成的合并提交（refs/pull/N/merge）不带
          # trailer，算进来会让每个 PR 无故变红；内容提交仍逐笔校验，跳过数显式打印。
          echo "[dco] 跳过合并提交数: $(git rev-list --merges --count "${BASE}..HEAD")"
          fail=0
          for sha in $(git rev-list --no-merges "${BASE}..HEAD"); do
            git log -1 --format='%B' "$sha" | grep -q 'Signed-off-by:' || {
              echo "::error::commit ${sha:0:12} 缺少 DCO 签署（git commit -s 后重推）"
              fail=1
            }
          done
          exit $fail

  galgame-compile:
    runs-on: ubuntu-latest
    needs: rebase-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: "类型门禁：com.winlator.galgame + 热点入口清单（对 ci/stubs）"
        run: |
          set -e
          rm -rf /tmp/stubs-out /tmp/check /tmp/hot
          mkdir -p /tmp/stubs-out /tmp/check /tmp/hot
          javac -d /tmp/stubs-out $(find ci/stubs -name '*.java')
          javac -Xlint:all -cp /tmp/stubs-out -d /tmp/check $(find app/src/main/java/com/winlator/galgame -name '*.java')
          # 热点入口清单唯一来源 = ci/hotspot-entries.txt；先证明没有第二份拷贝
          bash ci/check-hotspot-sync.sh
          HOT="$(grep -vE '^[[:space:]]*(#|$)' ci/hotspot-entries.txt || true)"
          if [ -z "$HOT" ]; then
            echo "::error::ci/hotspot-entries.txt 没有有效条目，热点门禁等于没跑"
            exit 1
          fi
          echo "热点清单（来自 ci/hotspot-entries.txt）:"
          echo "$HOT"
          javac -Xlint:all -cp /tmp/stubs-out:/tmp/check -d /tmp/hot $HOT
          echo "OK: com.winlator.galgame (whole tree) + hotspot entry classes compile clean (-Xlint:all)"

      - name: "JVM 回归测试（EngineDetector + LanguageDetector，统一入口 tools/run_detect_test.sh）"
        run: |
          set -e
          bash tools/run_detect_test.sh
          echo "OK: JVM regression tests passed"
