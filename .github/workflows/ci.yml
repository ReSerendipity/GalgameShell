name: GalgameShell CI

# P0/P7 CI（Plan §VIII.3/§VIII.4）：
#   1) rebase-guard —— 零改铁律 + 资产合法性（无需 Android SDK）
#   2) galgame-compile —— 用 ci/stubs 对 com.winlator.galgame 包做 javac -Xlint:all 类型门禁
# 说明：本 fork 按设计不含大二进制（wine/box64 运行时 .tzst 与 jniLibs .so），
#       故不在此做完整 APK 构建；完整构建需先按 README 补齐二进制。

on:
  push:
    branches: [galgame, main]
  pull_request:
    branches: [galgame]

jobs:
  rebase-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "零改铁律校验（Plan VIII.4）"
        run: |
          set -e
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "range: $BASE..HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)
          echo "$CHANGED"
          # 只锁官方真实路径（避免误伤 ci/stubs 里的同名桩）
          FORBIDDEN='^app/src/main/java/com/winlator/container/Container\.java$|^app/src/main/java/com/winlator/core/LocaleHelper\.java$|^app/src/main/res/values/strings\.xml$'
          if echo "$CHANGED" | grep -Eq "$FORBIDDEN"; then
            echo "FAIL: forbidden official file modified (violates zero-modification rule)"
            exit 1
          fi
          echo "OK: zero-modification guard passed"

      - name: "校验 JSON 资产"
        run: |
          python3 -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['app/src/main/assets/engine_presets.json','app/src/main/assets/galgame_fonts.json']]; print('OK: json assets valid')"

      - name: "校验 galgame 字符串 XML"
        run: |
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('app/src/main/res/values/galgame_strings.xml'); print('OK: galgame_strings.xml valid')"

  galgame-compile:
    runs-on: ubuntu-latest
    needs: rebase-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "类型门禁：com.winlator.galgame（对 ci/stubs）"
        run: |
          set -e
          rm -rf /tmp/stubs-out /tmp/check
          mkdir -p /tmp/stubs-out /tmp/check
          javac -d /tmp/stubs-out $(find ci/stubs -name '*.java')
          javac -Xlint:all -cp /tmp/stubs-out -d /tmp/check $(find app/src/main/java/com/winlator/galgame -name '*.java')
          echo "OK: com.winlator.galgame (whole tree) compiles clean (-Xlint:all)"

      - name: "EngineDetector 回归测试（tools/detect-test/DetectTest.java）"
        run: |
          set -e
          mkdir -p /tmp/detect-out
          javac -cp /tmp/stubs-out:/tmp/check -d /tmp/detect-out tools/detect-test/DetectTest.java
          java -cp /tmp/stubs-out:/tmp/check:/tmp/detect-out DetectTest
          echo "OK: EngineDetector regression tests passed"
