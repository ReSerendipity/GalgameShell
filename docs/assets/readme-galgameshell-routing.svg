<?xml version="1.0" encoding="UTF-8"?>
<!-- 引擎路由图：依据 app/src/main/java/com/winlator/galgame/EngineDetector.java 与 build.gradle 注释绘制。
     非运行截图，为架构/流程图解。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <linearGradient id="gNative" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="gExt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/><stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <linearGradient id="gEmu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#222">引擎检测与 A/B 路由（EngineDetector）</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#666">导入游戏目录后自动判定，共 19 种引擎指纹（v11.3）</text>

  <!-- Input -->
  <rect x="380" y="80" width="240" height="48" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="500" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#263238">游戏文件夹</text>
  <text x="500" y="120" text-anchor="middle" font-size="11" fill="#546e7a">SiglusEngine.exe / Game.EXE / data.xp3 …</text>

  <!-- Detect -->
  <line x1="500" y1="128" x2="500" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350" y="160" width="300" height="52" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="500" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#4527a0">EngineDetector.detect()</text>
  <text x="500" y="200" text-anchor="middle" font-size="11" fill="#5e35b1">指纹匹配 + detectDeep() 下钻（≤3 层，4000 项预算）</text>

  <!-- Three branches -->
  <line x1="430" y1="212" x2="200" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="212" x2="500" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="212" x2="800" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- B route: native embedded -->
  <rect x="60" y="270" width="280" height="120" rx="10" fill="url(#gNative)" stroke="#388e3c" stroke-width="2"/>
  <text x="200" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">B 路由 · 内嵌原生引擎</text>
  <text x="200" y="314" text-anchor="middle" font-size="12" fill="#2e7d32">Ren'Py 8.5.3（librenpython.so）</text>
  <text x="200" y="332" text-anchor="middle" font-size="12" fill="#2e7d32">KiriKiri2 / Kirikiroid2（libgame.so）</text>
  <text x="200" y="356" text-anchor="middle" font-size="11" fill="#33691e">进程内直启渲染，无 Wine 容器</text>
  <text x="200" y="374" text-anchor="middle" font-size="11" fill="#33691e">默认首选路由</text>

  <!-- B ext fallback -->
  <rect x="360" y="270" width="280" height="120" rx="10" fill="url(#gExt)" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">B 路由 · 外部原生播放器（可选）</text>
  <text x="500" y="314" text-anchor="middle" font-size="12" fill="#ef6c00">onscripter / Kirikiri2 / EasyRPG</text>
  <text x="500" y="332" text-anchor="middle" font-size="12" fill="#ef6c00">PPSSPP / Joiplay / TyranoBuilder</text>
  <text x="500" y="356" text-anchor="middle" font-size="11" fill="#bf360c">闭源播放器，设置中显式开启</text>
  <text x="500" y="374" text-anchor="middle" font-size="11" fill="#bf360c">仅作内嵌引擎不可用时的回退</text>

  <!-- A route: emulation -->
  <rect x="660" y="270" width="280" height="120" rx="10" fill="url(#gEmu)" stroke="#1565c0" stroke-width="2"/>
  <text x="800" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">A 路由 · Winlator 模拟层</text>
  <text x="800" y="314" text-anchor="middle" font-size="12" fill="#1565c0">Box64 + Wine 容器</text>
  <text x="800" y="332" text-anchor="middle" font-size="12" fill="#1565c0">Siglus / YU-RIS / Artemis / CatSystem2</text>
  <text x="800" y="356" text-anchor="middle" font-size="11" fill="#0d47a1">DXVK / Vortek / VirGL 渲染</text>
  <text x="800" y="374" text-anchor="middle" font-size="11" fill="#0d47a1">DirectShow 视频自动启用</text>

  <!-- Bottom -->
  <line x1="200" y1="390" x2="200" y2="430" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="500" y1="390" x2="500" y2="430" stroke="#f9a825" stroke-width="1.5"/>
  <line x1="800" y1="390" x2="800" y2="430" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="250" y="430" width="500" height="56" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="500" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#b71c1c">统一游戏库启动</text>
  <text x="500" y="474" text-anchor="middle" font-size="11" fill="#c62828">封面墙点按 → 自动注入 ja_JP 区域/字体 → 存档重定向到 S: 盘 → 诊断向导 + 日志</text>

  <text x="500" y="520" text-anchor="middle" font-size="11" fill="#888">检测到加密仅作提示，不破解；加密游戏需用户自备已解密数据。</text>
</svg>
