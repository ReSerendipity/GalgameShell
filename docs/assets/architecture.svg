  <text x="112" y="662" text-anchor="middle" font-size="13" fill="#334155">文档与治理</text>
  <text x="112" y="682" text-anchor="middle" font-size="11" fill="#64748b">docs/ · README</text>
  <text x="112" y="702" text-anchor="middle" font-size="11" fill="#64748b">.gitignore · AGENTS.md</text>

  <!-- 右栏：CI / 门禁 -->
  <g>
    <rect x="230" y="110" width="300" height="80" rx="10" fill="#0f766e" opacity="0.92"/>
    <text x="248" y="140" font-size="13" font-weight="bold" fill="#ffffff">.github/workflows/</text>
    <text x="248" y="162" font-size="11" fill="#d1fae5">ci.yml（类型门禁 + EngineDetector 回归）</text>
    <text x="248" y="178" font-size="11" fill="#d1fae5">gitleaks.yml（密钥扫描）· release.yml（发布链）</text>

    <rect x="560" y="110" width="300" height="80" rx="10" fill="#0f766e" opacity="0.78"/>
    <text x="578" y="140" font-size="13" font-weight="bold" fill="#ffffff">ci/（本地门禁）</text>
    <text x="578" y="162" font-size="11" fill="#d1fae5">pre-push 钩子 · stubs 补桩 · hotspot-entries.txt</text>
    <text x="578" y="178" font-size="11" fill="#d1fae5">check-dco.sh · check-zero-mod.sh</text>
  </g>

