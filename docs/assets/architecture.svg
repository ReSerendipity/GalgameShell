  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="860" fill="#f7f8fa"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="26" font-weight="bold" fill="#1f2937">GalgameShell 仓库架构</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">Repository Architecture · 基于仓库真实目录结构绘制 · 许可证 LGPL-2.1（继承自 winlator-app）</text>

  <!-- 左栏标签轨 -->
  <rect x="24" y="110" width="176" height="80" rx="10" fill="#eef2f7" stroke="#c9d2de"/>
  <text x="112" y="142" text-anchor="middle" font-size="13" fill="#334155">CI / 门禁</text>
  <text x="112" y="162" text-anchor="middle" font-size="11" fill="#64748b">.github/ · ci/</text>

  <rect x="24" y="210" width="176" height="150" rx="10" fill="#eef2f7" stroke="#c9d2de"/>
  <text x="112" y="272" text-anchor="middle" font-size="13" fill="#334155">App 层</text>
  <text x="112" y="292" text-anchor="middle" font-size="11" fill="#64748b">app/（Android）</text>
  <text x="112" y="312" text-anchor="middle" font-size="11" fill="#64748b">Java 增量层 + C++</text>
  <text x="112" y="332" text-anchor="middle" font-size="11" fill="#64748b">渲染/兼容层 + assets</text>

  <rect x="24" y="380" width="176" height="120" rx="10" fill="#eef2f7" stroke="#c9d2de"/>
