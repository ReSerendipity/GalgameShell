    <text x="248" y="672" font-size="11" fill="#dcfce7">架构评审 · 决策登记 · 技术债登记 · 真机验证</text>
    <text x="248" y="692" font-size="11" fill="#dcfce7">发布规范 · 引擎集成 · 上游回馈清单等</text>

    <rect x="560" y="620" width="300" height="100" rx="10" fill="#15803d" opacity="0.68"/>
    <text x="578" y="650" font-size="13" font-weight="bold" fill="#ffffff">README.md（本图入口 + 文档索引）</text>
    <text x="578" y="672" font-size="11" fill="#dcfce7">CHANGELOG.md · NOTICE（第三方许可）</text>
    <text x="578" y="692" font-size="11" fill="#dcfce7">.gitignore（AGENTS.md 不入库，2026-10-25 迁移）</text>

    <rect x="890" y="620" width="276" height="100" rx="10" fill="#15803d" opacity="0.55"/>
    <text x="908" y="650" font-size="13" font-weight="bold" fill="#ffffff">AGENTS.md</text>
    <text x="908" y="672" font-size="11" fill="#dcfce7">AI 辅助开发指南（本地维护者上下文）</text>
    <text x="908" y="692" font-size="11" fill="#dcfce7">仅本地保留，不入库（git rm --cached）</text>
  </g>

