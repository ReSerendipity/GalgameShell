    <text x="248" y="262" font-size="11" fill="#dbeafe">GalgameShell 增量层（本仓核心）</text>
    <text x="248" y="282" font-size="11" fill="#dbeafe">EngineDetector 引擎识别 · A/B 双路由</text>
    <text x="248" y="302" font-size="11" fill="#dbeafe">ImportFlow 导入 · 容器/Wine 启动链</text>
    <text x="248" y="322" font-size="11" fill="#dbeafe">GalgameLibraryActivity / HomeFragment UI</text>
    <text x="248" y="342" font-size="11" fill="#dbeafe">诊断向导 · 存档重定向 · 一键日文化</text>

    <rect x="560" y="210" width="300" height="150" rx="10" fill="#1d4ed8" opacity="0.7"/>
    <text x="578" y="240" font-size="13" font-weight="bold" fill="#ffffff">app/src/main/cpp/</text>
    <text x="578" y="262" font-size="11" fill="#dbeafe">winlator（容器基座）</text>
    <text x="578" y="282" font-size="11" fill="#dbeafe">virglrenderer / vortekrenderer / gladiorenderer</text>
    <text x="578" y="302" font-size="11" fill="#dbeafe">libadrenotools（Adreno 驱动）</text>
    <text x="578" y="322" font-size="11" fill="#dbeafe">midihandler</text>

    <rect x="890" y="210" width="276" height="150" rx="10" fill="#1d4ed8" opacity="0.55"/>
    <text x="908" y="240" font-size="13" font-weight="bold" fill="#ffffff">app/src/main/assets/</text>
    <text x="908" y="262" font-size="11" fill="#dbeafe">engine_presets.json（引擎预设）</text>
    <text x="908" y="282" font-size="11" fill="#dbeafe">renpy-engine/（引擎载荷）</text>
    <text x="908" y="302" font-size="11" fill="#dbeafe">box64 / wine 运行时（不随仓分发）</text>
    <text x="908" y="322" font-size="11" fill="#dbeafe">字体 / 输入控件 / 壁纸等资源</text>
  </g>

  <!-- 右栏：引擎与运行时 -->
  <g>
    <rect x="230" y="380" width="300" height="120" rx="10" fill="#7c3aed" opacity="0.88"/>
    <text x="248" y="410" font-size="13" font-weight="bold" fill="#ffffff">renpy-engine/renpy/（Ren'Py 8.5.3 源码）</text>
    <text x="248" y="432" font-size="11" fill="#ede9fe">Python 3.12.8 引擎包（audio / display / sl2 / text…）</text>
    <text x="248" y="452" font-size="11" fill="#ede9fe">编译中间产物 __pycache__ 不入库（2026-10-25 清理）</text>
    <text x="248" y="472" font-size="11" fill="#ede9fe">librenpython.so 配套运行时（lib/ 载荷保留）</text>

    <rect x="560" y="380" width="300" height="120" rx="10" fill="#7c3aed" opacity="0.72"/>
    <text x="578" y="410" font-size="13" font-weight="bold" fill="#ffffff">Kirikiri2（Kirikiroid2 内嵌）</text>
    <text x="578" y="432" font-size="11" fill="#ede9fe">libgame.so，真机验证通过（bosei2）</text>
    <text x="578" y="452" font-size="11" fill="#ede9fe">KR2Activity 原生直启渲染</text>

    <rect x="890" y="380" width="276" height="120" rx="10" fill="#7c3aed" opacity="0.6"/>
    <text x="908" y="410" font-size="13" font-weight="bold" fill="#ffffff">Winlator 容器引擎</text>
    <text x="908" y="432" font-size="11" fill="#ede9fe">模拟层兜底（A 路由）</text>
    <text x="908" y="452" font-size="11" fill="#ede9fe">Wine / box64 运行时按设计不随仓分发</text>
    <text x="908" y="472" font-size="11" fill="#ede9fe">由使用者从上游补齐（README「获取运行时资源」）</text>
  </g>

  <!-- 右栏：脚本与工具 -->
  <g>
    <rect x="230" y="520" width="300" height="80" rx="10" fill="#d97706" opacity="0.85"/>
    <text x="248" y="550" font-size="13" font-weight="bold" fill="#ffffff">scripts/</text>
    <text x="248" y="572" font-size="11" fill="#fef3c7">seed_and_merge.sh（并入上游增量层，身份环境变量可覆盖）</text>
    <text x="248" y="588" font-size="11" fill="#fef3c7">check_licenses.py · gen_galgame_stubs.py</text>

    <rect x="560" y="520" width="300" height="80" rx="10" fill="#d97706" opacity="0.72"/>
