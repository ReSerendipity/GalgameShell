  <!-- 路由说明 -->
  <rect x="230" y="742" width="936" height="92" rx="10" fill="#ffffff" stroke="#c9d2de"/>
  <text x="250" y="768" font-size="13" font-weight="bold" fill="#1f2937">运行路由（引擎识别 → 自动选择）</text>
  <text x="250" y="790" font-size="12" fill="#374151">B 路由：Ren'Py / Kirikiri2 游戏 → 内嵌原生引擎直启渲染（librenpython.so / libgame.so）</text>
  <text x="250" y="812" font-size="12" fill="#374151">A 路由：其余游戏 → Winlator 容器模拟（Wine / box64）；外部原生播放器为可选回退（默认关闭）</text>

